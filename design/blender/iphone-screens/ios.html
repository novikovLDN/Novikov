<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:430px;height:932px;overflow:hidden;background:#000;font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.scr{position:relative;width:430px;height:932px;overflow:hidden;background:#fff}
.status{position:absolute;inset:0 0 auto 0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 42px;z-index:20;font-weight:600;font-size:17px;color:#000}
.status .r{display:flex;gap:6px;align-items:center}
.bars{display:flex;gap:2px;align-items:flex-end;height:12px}.bars i{width:3px;background:#000;border-radius:1px}
.bat{width:26px;height:12px;border:1.5px solid rgba(0,0,0,.45);border-radius:4px;padding:1.5px;position:relative}.bat i{display:block;height:100%;width:78%;background:#000;border-radius:2px}
.wifi{width:17px;height:12px;background:radial-gradient(circle at 50% 100%,#000 0 3px,transparent 3.5px),radial-gradient(circle at 50% 100%,transparent 0 5px,#000 5.5px 7px,transparent 7.5px),radial-gradient(circle at 50% 100%,transparent 0 9px,#000 9.5px 11px,transparent 11.5px);clip-path:polygon(0 0,100% 0,50% 100%)}
.page{position:absolute;left:0;right:0;top:54px;bottom:0;background:url(dash.png) top/430px auto no-repeat}
.glass{background:rgba(250,250,252,.78);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 34px rgba(10,20,40,.16),inset 0 1px 0 rgba(255,255,255,.9)}
.bar{position:absolute;left:14px;right:14px;bottom:38px;height:54px;display:flex;align-items:center;gap:8px;z-index:10}
.circ{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#1a1a1a;flex:none}
.addr{flex:1;height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;color:#111;font-weight:500}
.addr .lock{width:11px;height:13px;border:2px solid #555;border-radius:3px;position:relative;margin-top:4px}.addr .lock:before{content:"";position:absolute;left:1px;right:1px;top:-7px;height:7px;border:2px solid #555;border-bottom:0;border-radius:6px 6px 0 0}
.dots{display:flex;gap:4px}.dots i{width:5px;height:5px;border-radius:50%;background:#1a1a1a}
.home{position:absolute;left:50%;bottom:9px;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#111;z-index:30}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.22);z-index:5}
.tap{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;z-index:40;pointer-events:none;background:rgba(20,50,184,.10);box-shadow:0 0 0 3px rgba(20,50,184,.95),0 0 0 12px rgba(20,50,184,.16),0 8px 24px rgba(20,50,184,.25)}
.hl{outline:3px solid #1432B8;outline-offset:-3px;background:rgba(20,50,184,.10)!important}
.menu{position:absolute;right:14px;bottom:104px;width:262px;border-radius:28px;padding:8px;z-index:12}
.mi{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border-radius:18px;font-size:17px;color:#111}
.mi svg{width:22px;height:22px;stroke:#111;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sep{height:1px;background:rgba(0,0,0,.08);margin:4px 12px}
.sheet{position:absolute;left:0;right:0;bottom:0;height:640px;border-radius:38px 38px 0 0;padding:14px 16px 0;z-index:12;background:rgba(246,246,248,.96)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(0,0,0,.18);margin:0 auto 14px}
.shd{display:flex;align-items:center;gap:12px;padding:6px 6px 14px}
.shd img{width:54px;height:54px;border-radius:13px}
.shd b{display:block;font-size:17px;color:#111}.shd span{font-size:14px;color:#6b6b70}
.x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.07);display:grid;place-items:center;color:#555;font-size:17px}
.apps{display:flex;gap:18px;padding:6px 4px 16px;border-bottom:1px solid rgba(0,0,0,.07)}
.app{width:66px;text-align:center;font-size:12px;color:#333}
.app i{display:block;width:60px;height:60px;margin:0 auto 6px;border-radius:15px;background:linear-gradient(160deg,#e9ecf2,#cfd5df)}
.app:nth-child(2) i{background:linear-gradient(160deg,#dfe7ff,#b8c8ff)}.app:nth-child(3) i{background:linear-gradient(160deg,#e8f4ee,#c5e3d2)}.app:nth-child(4) i{background:linear-gradient(160deg,#fff1dc,#f5d6a6)}
.grp{margin-top:14px;border-radius:18px;background:#fff;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 18px;font-size:17px;color:#111;border-bottom:1px solid rgba(0,0,0,.06)}
.row:last-child{border-bottom:0}
.row svg{width:22px;height:22px;stroke:#111;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.add{position:absolute;inset:54px 0 0 0;background:#f2f2f7;z-index:12;padding:0 18px}
.nav{display:flex;align-items:center;justify-content:space-between;height:58px;font-size:17px}
.nav .c{color:#1432B8}.nav b{color:#111}.nav .d{color:#1432B8;font-weight:600;padding:8px 12px;border-radius:12px}
.card{margin-top:18px;border-radius:18px;background:#fff;padding:16px;display:flex;gap:14px;align-items:center}
.card img{width:64px;height:64px;border-radius:15px}
.card .f{flex:1}.card .f div{height:40px;display:flex;align-items:center;border-bottom:1px solid rgba(0,0,0,.08);font-size:17px;color:#111}.card .f span{display:block;padding-top:8px;font-size:14px;color:#8a8a8e}
.tg{margin-top:18px;border-radius:18px;background:#fff;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px;color:#111}
.sw{width:52px;height:32px;border-radius:16px;background:#34c759;position:relative}.sw:after{content:"";position:absolute;right:2px;top:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cap{margin:10px 6px 0;font-size:13px;color:#8a8a8e;line-height:1.4}
.wall{position:absolute;inset:0;background:radial-gradient(120% 70% at 20% 10%,#6b86ff 0,transparent 60%),radial-gradient(90% 60% at 90% 90%,#0c2a8f 0,transparent 60%),linear-gradient(160deg,#2848d8,#0b1a6b)}
.grid{position:absolute;left:28px;right:28px;top:96px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px;z-index:3}
.ic{text-align:center;font-size:12px;color:#fff;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ic i{display:block;width:64px;height:64px;margin:0 auto 6px;border-radius:16px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35)}
.ic img{display:block;width:64px;height:64px;margin:0 auto 6px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.dock{position:absolute;left:14px;right:14px;bottom:26px;height:96px;border-radius:34px;background:rgba(255,255,255,.22);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);display:flex;justify-content:space-around;align-items:center;z-index:3}
.dock i{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.4)}
.status.w{color:#fff}.status.w .bars i,.status.w .bat i{background:#fff}.status.w .bat{border-color:rgba(255,255,255,.6)}
</style></head><body><div class="scr" id="s"></div>
<script>
const step=+new URLSearchParams(location.search).get('step')||1;
const st=(w)=>`<div class="status ${w?'w':''}"><span>9:41</span><span class="r"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i></span><span class="wifi" style="${w?'filter:invert(1)':''}"></span><span class="bat"><i></i></span></span></div>`;
const bar=(hlDots)=>`<div class="bar"><div class="circ glass">‹</div><div class="addr glass"><span class="lock"></span>atlassecure.uk</div><div class="circ glass ${hlDots?'hl':''}" id="dots"><span class="dots"><i></i><i></i><i></i></span></div></div>`;
const sh='<svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>';
const plus='<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
const S=document.getElementById('s');let tap=null;
if(step===1){S.innerHTML=st()+'<div class="page"></div>'+bar(true)+'<div class="home"></div>';tap=[389,885];}
if(step===2){S.innerHTML=st()+'<div class="page"></div><div class="dim" style="background:rgba(0,0,0,.08)"></div>'+bar(false)+
 `<div class="menu glass"><div class="mi hl" id="share">Поделиться ${sh}</div><div class="sep"></div><div class="mi">Добавить закладку <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></div><div class="mi">Найти на странице <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div><div class="mi">Новая вкладка <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div class="sep"></div><div class="mi">Настройки сайта <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div></div><div class="home"></div>`;tap=[210,580];}
if(step===3){S.innerHTML=st()+'<div class="page"></div><div class="dim"></div>'+
 `<div class="sheet glass"><div class="grab"></div><div class="shd"><img src="icon.png"><div><b>Atlas Secure</b><span>atlassecure.uk</span></div><div class="x">✕</div></div>
 <div class="apps"><div class="app"><i></i>Сообщения</div><div class="app"><i></i>Почта</div><div class="app"><i></i>Заметки</div><div class="app"><i></i>Ещё</div></div>
 <div class="grp"><div class="row">Скопировать <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></div><div class="row">Добавить закладку <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></div><div class="row">В список для чтения <svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/></svg></div><div class="row hl" id="home">На экран «Домой» ${plus}</div><div class="row">Разметка <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></div></div></div><div class="home"></div>`;tap=[190,0];}
if(step===4){S.innerHTML=st()+`<div class="add"><div class="nav"><span class="c">Отменить</span><b>На экран «Домой»</b><span class="d hl" id="addb">Добавить</span></div>
 <div class="card"><img src="icon.png"><div class="f"><div>Atlas Secure</div><span>https://atlassecure.uk/dashboard</span></div></div>
 <div class="tg">Открыть как веб-приложение <span class="sw"></span></div>
 <p class="cap">На экран «Домой» будет добавлен значок, чтобы Вы могли быстро открывать этот веб-сайт.</p></div><div class="home"></div>`;tap=[0,0];}
if(step===5){S.innerHTML='<div class="wall"></div>'+st(true)+`<div class="grid">${'<div class="ic"><i></i>&nbsp;</div>'.repeat(9)}<div class="ic" id="atl"><img src="icon.png">Atlas Secure</div>${'<div class="ic"><i></i>&nbsp;</div>'.repeat(6)}</div><div class="dock"><i></i><i></i><i></i><i></i></div><div class="home" style="background:#fff"></div>`;tap=[0,0];}
requestAnimationFrame(()=>{
 const pin=(el)=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
 if(step===3){const r=document.getElementById('home').getBoundingClientRect();tap=[r.right-38,r.top+r.height/2];}
 if(step===2){const r=document.getElementById('share').getBoundingClientRect();tap=[r.right-36,r.top+r.height/2];}
 if(step===4){const r=document.getElementById('addb').getBoundingClientRect();tap=[Math.min(r.right-14,430-62),r.bottom+6];}
 if(step===5) {const p=pin(document.getElementById('atl').querySelector('img'));tap=p;}
 const t=document.createElement('div');t.className='tap';t.style.left=tap[0]+'px';t.style.top=tap[1]+'px';S.appendChild(t);
 document.title='ready';
});
</script></body></html>
